services:
  db:
    image: mysql:8.0
    container_name: handover-card-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: handover_card
      MYSQL_USER: ${DB_USERNAME:-handover}
      MYSQL_PASSWORD: ${DB_PASSWORD:-handover}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 개발 환경의 S3. 운영에서 쓸 AWS S3와 같은 API라 애플리케이션은 엔드포인트만 다르게 본다.
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: handover-card-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-handover}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-handover-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 버킷을 한 번만 만들고 종료되는 보조 컨테이너
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-handover}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-handover-secret}
      S3_BUCKET: ${S3_BUCKET:-handover-audio}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      echo 'bucket ready: '$$S3_BUCKET
      "

volumes:
  db-data:
  storage-data:
