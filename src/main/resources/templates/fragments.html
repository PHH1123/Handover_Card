<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<style th:fragment="styles">
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
           margin: 0; padding: 2rem 1rem; background: #f5f6f8; color: #1f2933; line-height: 1.5; }
    .wrap { max-width: 880px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
    h3 { font-size: .95rem; margin: 1rem 0 .35rem; color: #52606d; }
    label { display: block; font-size: .85rem; color: #52606d; margin: .6rem 0 .2rem; }
    input, select { width: 100%; padding: .5rem; border: 1px solid #cbd2d9; border-radius: 4px; font-size: .95rem; }
    input[readonly] { background: #f0f2f4; color: #52606d; cursor: not-allowed; }
    button { padding: .5rem 1rem; border: 0; border-radius: 4px; background: #2b6cb0; color: #fff;
             font-size: .9rem; cursor: pointer; }
    button.secondary { background: #718096; }
    button.danger { background: #c53030; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > div { flex: 1 1 200px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #eceef0; }
    th { color: #52606d; font-weight: 600; }
    a { color: #2b6cb0; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .muted { color: #7b8794; font-size: .85rem; }
    .alert { padding: .6rem .8rem; border-radius: 4px; margin-bottom: 1rem; font-size: .9rem; }
    .alert.error { background: #fde8e8; color: #9b1c1c; }
    .alert.info { background: #e6f2ff; color: #1c4f9b; }
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .78rem;
             background: #e4e7eb; color: #3e4c59; }
    .badge.done { background: #def7ec; color: #03543f; }
    .badge.failed { background: #fde8e8; color: #9b1c1c; }
    .field-error { color: #9b1c1c; font-size: .8rem; margin-top: .2rem; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f7f8f9; padding: .75rem;
          border-radius: 4px; font-size: .88rem; margin: 0; }
    ul { margin: .25rem 0; padding-left: 1.2rem; font-size: .9rem; }
    .actions { display: flex; gap: .5rem; margin-top: 1rem; }

    /* 음성 입력 탭 (파일 업로드 / 직접 녹음) */
    .tabs { display: flex; gap: .25rem; border-bottom: 1px solid #e3e6ea; margin-bottom: .75rem; }
    .tab { background: none; color: #7b8794; border-bottom: 2px solid transparent;
           border-radius: 0; padding: .5rem .9rem; font-size: .9rem; }
    .tab.active { color: #2b6cb0; border-bottom-color: #2b6cb0; font-weight: 600; }
    .recorder { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .rec-dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%;
               background: #c53030; margin-right: .4rem; vertical-align: middle; }
    .rec-dot.idle { background: #cbd2d9; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .recording .rec-dot { animation: pulse 1s infinite; }
    .timer { font-variant-numeric: tabular-nums; font-size: .95rem; color: #3e4c59; }
    audio { width: 100%; margin-top: .75rem; }
    .audio-status { margin-top: .6rem; font-size: .85rem; }
    .audio-status.ready { color: #03543f; }

    /* 마이크 입력 레벨 미터 — 무음 녹음인지 재생 문제인지 구분용 */
    .meter-wrap { display: flex; align-items: center; gap: .6rem; margin-top: .75rem; }
    .meter { flex: 1; height: .5rem; background: #e4e7eb; border-radius: 999px; overflow: hidden; }
    .meter-bar { height: 100%; width: 0; background: #38a169; transition: width .06s linear; }
    .meter-wrap .muted { font-size: .8rem; white-space: nowrap; }
    #recordDownload { display: inline-block; margin-top: .5rem; font-size: .85rem; }

    /* 요약 항목의 원문 언어 줄 — 번역 줄 아래에 보조로 표시 */
    .summary-source { color: #7b8794; font-size: .85rem; margin-top: .1rem; }
    li + li { margin-top: .45rem; }
</style>
</head>
</html>
