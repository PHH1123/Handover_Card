<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팀 관리 · Handover Card</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div class="wrap">
    <div class="top">
        <h1 style="margin: 0;">팀 관리</h1>
        <div>
            <a th:href="@{/web/cards}">인수인계 카드 →</a>
        </div>
    </div>

    <div class="alert info" th:if="${message}" th:text="${message}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <!-- ===== 팀에 소속된 경우 ===== -->
    <div th:if="${page.myTeam != null}">
        <div class="card">
            <h2 th:text="${page.myTeam.name}"></h2>
            <p class="muted" style="margin-top: 0;">
                <span th:text="'팀장: ' + ${page.myTeam.leaderName}"></span>
                <span th:if="${page.leader}"> · 내가 팀장입니다</span>
            </p>

            <h3>팀원</h3>
            <table>
                <thead>
                <tr><th>이름</th><th>이메일</th><th>역할</th><th th:if="${page.leader}">관리</th></tr>
                </thead>
                <tbody>
                <tr th:each="member : ${page.members}">
                    <td th:text="${member.name}"></td>
                    <td th:text="${member.email}"></td>
                    <td>
                        <span class="badge" th:classappend="${member.leader} ? 'done' : ''"
                              th:text="${member.leader} ? '팀장' : '팀원'"></span>
                    </td>
                    <td th:if="${page.leader}">
                        <div style="display: flex; gap: .4rem;" th:unless="${member.leader}">
                            <form method="post" th:action="@{/web/teams/members/{id}/promote(id=${member.memberId})}"
                                  th:data-confirm="${member.name} + '님에게 팀장을 위임할까요? 나는 일반 팀원이 됩니다.'">
                                <button type="submit" class="secondary">팀장 위임</button>
                            </form>
                            <form method="post" th:action="@{/web/teams/members/{id}/kick(id=${member.memberId})}"
                                  th:data-confirm="${member.name} + '님을 팀에서 내보낼까요?'">
                                <button type="submit" class="danger">추방</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <form class="actions" method="post" th:action="@{/web/teams/leave}" th:unless="${page.leader}"
                  data-confirm="팀에서 나갈까요?">
                <button type="submit" class="secondary">팀 나가기</button>
            </form>

            <div th:if="${page.leader}">
                <p class="muted">팀장은 팀을 나갈 수 없습니다. 다른 팀원에게 위임하거나 팀을 삭제해 주세요.</p>
                <form class="actions" method="post" th:action="@{/web/teams/delete}"
                      data-confirm="팀을 삭제할까요? 모든 팀원의 소속이 해제되고 가입 신청 기록도 사라집니다.">
                    <button type="submit" class="danger">팀 삭제</button>
                </form>
            </div>
        </div>

        <!-- 팀장에게만 보이는 승인 목록 -->
        <div class="card" th:if="${page.leader}">
            <h2>가입 신청</h2>
            <p class="muted" th:if="${page.pendingRequests.isEmpty()}" style="margin-bottom: 0;">
                대기 중인 신청이 없습니다.
            </p>
            <table th:unless="${page.pendingRequests.isEmpty()}">
                <thead>
                <tr><th>이름</th><th>이메일</th><th>신청 일시</th><th>처리</th></tr>
                </thead>
                <tbody>
                <tr th:each="request : ${page.pendingRequests}">
                    <td th:text="${request.memberName}"></td>
                    <td th:text="${request.memberEmail}"></td>
                    <td class="muted" th:text="${request.requestedAt}"></td>
                    <td>
                        <div style="display: flex; gap: .4rem;">
                            <form method="post" th:action="@{/web/teams/requests/{id}/approve(id=${request.id})}">
                                <button type="submit">승인</button>
                            </form>
                            <form method="post" th:action="@{/web/teams/requests/{id}/reject(id=${request.id})}">
                                <button type="submit" class="danger">거절</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== 아직 팀이 없는 경우 ===== -->
    <div th:if="${page.myTeam == null}">
        <div class="card" th:if="${page.myPendingRequest != null}">
            <h2>승인 대기 중</h2>
            <p style="margin-bottom: 0;">
                <strong th:text="${page.myPendingRequest.teamName}"></strong> 팀에 가입을 신청했습니다.
                팀장이 승인하면 팀원이 됩니다.
            </p>
        </div>

        <div class="card">
            <h2>팀 만들기</h2>
            <p class="muted" style="margin-top: 0;">팀을 만들면 내가 팀장이 되고, 다른 회원의 가입 신청을 승인할 수 있습니다.</p>
            <form method="post" th:action="@{/web/teams}">
                <label for="name">팀 이름</label>
                <input type="text" id="name" name="name" placeholder="결제팀" required>
                <div class="actions">
                    <button type="submit">팀 만들기</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>팀 가입 신청</h2>
            <p class="muted" th:if="${page.joinableTeams.isEmpty()}" style="margin-bottom: 0;">
                아직 만들어진 팀이 없습니다. 위에서 팀을 만들어 보세요.
            </p>
            <table th:unless="${page.joinableTeams.isEmpty()}">
                <thead>
                <tr><th>팀 이름</th><th>팀장</th><th>인원</th><th>신청</th></tr>
                </thead>
                <tbody>
                <tr th:each="team : ${page.joinableTeams}">
                    <td th:text="${team.name}"></td>
                    <td th:text="${team.leaderName}"></td>
                    <td th:text="${team.memberCount} + '명'"></td>
                    <td>
                        <form method="post" th:action="@{/web/teams/{id}/join(id=${team.id})}">
                            <button type="submit" th:disabled="${page.myPendingRequest != null}">신청</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card" th:unless="${page.myRequests.isEmpty()}">
            <h2>내 신청 내역</h2>
            <table>
                <thead>
                <tr><th>팀</th><th>상태</th><th>신청 일시</th></tr>
                </thead>
                <tbody>
                <tr th:each="request : ${page.myRequests}">
                    <td th:text="${request.teamName}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${request.status.name() == 'APPROVED'} ? 'done' : (${request.status.name() == 'REJECTED'} ? 'failed' : '')"
                              th:text="${request.status}"></span>
                    </td>
                    <td class="muted" th:text="${request.requestedAt}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
/*
 * 되돌릴 수 없는 동작의 확인 창.
 * Thymeleaf가 th:on* 안의 문자열 표현식을 막기 때문에(XSS 방지) 문구는 data-confirm으로 넘긴다.
 */
document.querySelectorAll('form[data-confirm]').forEach(function (form) {
    form.addEventListener('submit', function (event) {
        if (!window.confirm(form.dataset.confirm)) {
            event.preventDefault();
        }
    });
});
</script>
</body>
</html>
