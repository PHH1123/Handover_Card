<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 · Handover Card</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<div class="wrap" style="max-width: 420px;">
    <h1>Handover Card</h1>

    <div class="card">
        <h2>로그인</h2>

        <div class="alert info" th:if="${message}" th:text="${message}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form method="post" th:action="@{/web/login}">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" th:value="${email}" required autofocus>

            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>

            <div class="actions">
                <button type="submit">로그인</button>
            </div>
        </form>

        <p class="muted" style="margin-bottom: 0;">
            계정이 없나요? <a th:href="@{/web/signup}">회원가입</a>
        </p>
    </div>
</div>
</body>
</html>
