spring:
  application:
    name: handover-card
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: jdbc:mysql://localhost:3306/handover_card?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:handover}
    password: ${DB_PASSWORD:handover}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  security:
    oauth2:
      client:
        registration:
          # 클라이언트 ID/시크릿은 각자 발급받는 값이라 저장소에 넣지 않는다. 환경 변수가 없으면
          # `unset`이 채워지고, 그 공급자는 로그인 화면에 버튼이 뜨지 않는다(SocialLoginProviders).
          google:
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            # openid를 빼서 OIDC 대신 일반 OAuth 2.0 흐름을 쓴다. 그래야 GitHub와 똑같이
            # "액세스 토큰으로 사용자 정보 엔드포인트 호출" 한 갈래로 처리할 수 있다.
            scope: profile, email
          github:
            client-id: ${GITHUB_CLIENT_ID:unset}
            client-secret: ${GITHUB_CLIENT_SECRET:unset}
            # user:email이 있어야 비공개 이메일과 인증 여부를 읽을 수 있다.
            scope: read:user, user:email
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-4o-mini
      audio:
        transcription:
          model: gpt-4o-mini-transcribe

server:
  port: 8080

handover:
  storage:
    # local: 로컬 디스크 / s3: S3 호환 저장소 (개발은 docker-compose의 MinIO, 운영은 AWS S3)
    provider: ${STORAGE_PROVIDER:s3}
    base-dir: ./data/audio
    s3:
      bucket: ${S3_BUCKET:handover-audio}
      region: ${S3_REGION:us-east-1}
      # 운영(실제 AWS)에서는 비워 두면 기본 엔드포인트를 쓴다
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      # 운영에서는 비워 두고 인스턴스 역할 등 SDK 기본 자격증명 체인을 쓴다
      access-key: ${S3_ACCESS_KEY:handover}
      secret-key: ${S3_SECRET_KEY:handover-secret}
      path-style-access: ${S3_PATH_STYLE:true}
  web:
    cors:
      # 브라우저에서 API를 직접 부르는 프론트엔드 주소. 쉼표로 구분한다.
      # 정확한 주소와 패턴을 모두 받는다. 개발 서버는 포트가 자주 바뀌므로 [*]가 편하다.
      # 예: CORS_ALLOWED_ORIGINS=http://localhost:[*],https://www.handover-card.o-r.kr
      # 비워 두면 CORS 헤더를 붙이지 않는다(화면과 API가 같은 서버일 때는 필요 없다).
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    cookie:
      # 로컬 개발은 HTTP라 꺼 둔다. 켜면 브라우저가 쿠키를 보내지 않아 로그인이 되지 않는다.
      # 운영(HTTPS)에서는 application-prod.yml이 켠다.
      secure: ${COOKIE_SECURE:false}
  async:
    core-pool-size: 2
    max-pool-size: 5
    queue-capacity: 50

transcription:
  provider: mock
  mock:
    simulated-delay-ms: 800

summarization:
  provider: openai
  mock:
    simulated-delay-ms: 500

jwt:
  # MUST be overridden via JWT_SECRET in any non-local environment — this default is dev-only.
  secret: ${JWT_SECRET:dev-only-change-me-please-this-secret-must-be-at-least-32-bytes-long-in-production}
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 1209600

# future, added when real Agora RTT is wired in:
