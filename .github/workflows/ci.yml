name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연달아 푸시하면 이전 실행을 취소한다. private 저장소는 실행 시간이 무료 한도에서
# 깎이므로, 어차피 결과를 안 볼 실행에 분을 쓰지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.gradle의 툴체인이 25로 고정되어 있어 러너에도 25가 있어야 한다.
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      # 의존성과 빌드 캐시를 실행 간에 재사용한다.
      - uses: gradle/actions/setup-gradle@v4

      # build = 컴파일 + 테스트 + jar 패키징. 테스트는 H2와 mock provider로 돌아가므로
      # DB나 S3 같은 외부 의존이 없다(application-test.yml).
      - run: ./gradlew build

      # 실패했을 때 어느 테스트가 왜 깨졌는지 로그만으로는 보기 힘들다.
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  image:
    name: 컨테이너 이미지 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 이미지를 밀지는 않고 빌드가 되는지만 본다. 이게 없으면 Dockerfile이 깨져도
      # EC2에서 배포하는 순간에야 알게 된다.
      # 레이어 캐시를 Actions 캐시에 저장해 두 번째 실행부터는 의존성 계층을 건너뛴다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
