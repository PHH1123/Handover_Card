# 앱 컨테이너로 넘기는 공통 프록시 설정. /etc/nginx/snippets/handover-card-proxy.conf 로 복사한다.
#
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/handover-card-proxy.conf /etc/nginx/snippets/
#
# handover-card.conf의 여러 location에서 include 한다. 한 곳에서만 고치면 되도록 분리해 두었다.

proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# 이 헤더가 없으면 애플리케이션이 자기 주소를 http로 인식해 OAuth 리다이렉트 URI가
# http://로 만들어지고 소셜 로그인이 실패한다. application-prod.yml의
# server.forward-headers-strategy=framework 와 짝을 이룬다.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# 업로드 후 전사·요약 파이프라인이 도는 동안 응답이 늦어질 수 있다.
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;
