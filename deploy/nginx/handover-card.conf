# 가비아 클라우드 서버의 nginx 설정. /etc/nginx/conf.d/handover-card.conf 로 복사해서 쓴다.
#
# 한 도메인에서 프론트(정적 파일)와 API를 함께 서비스하는 단일 오리진 구성이다.
# 브라우저가 보기에 같은 출처라 CORS가 발생하지 않는다(그래서 CORS_ALLOWED_ORIGINS는 비워 둔다).
#
#   /            → /var/www/handover-card 의 정적 파일 (SPA)
#   /api/**      → 앱 컨테이너
#   그 외 앱 경로 → 앱 컨테이너 (handover-card-locations.conf 참고)
#
# ─────────────────────────────────────────────────────────────────────────────
# 이 파일은 **최초 1회만** 복사한다. 갱신할 때는 절대 덮어쓰지 말 것.
#
# certbot --nginx 가 이 파일을 직접 고쳐서 listen 443 ssl 과 인증서 경로를 써 넣기 때문이다.
# 덮어쓰면 그 편집분이 사라져 HTTPS가 통째로 없어진다(증상: 사이트가 안 열림).
# 경로 규칙은 전부 handover-card-locations.conf 에 있고 그 파일은 언제든 덮어써도 안전하다.
#
#   갱신 시:  sudo cp deploy/nginx/handover-card-locations.conf /etc/nginx/snippets/
#             sudo nginx -t && sudo systemctl reload nginx
#
# 실수로 덮어썼다면 인증서를 다시 설치하면 복구된다(재발급 아님):
#   sudo certbot install --nginx --cert-name handover-card.o-r.kr
# ─────────────────────────────────────────────────────────────────────────────
#
# 아래는 인증서를 받기 전 상태다. 인증서가 없으면 443을 열 수 없으므로
#   sudo certbot --nginx -d handover-card.o-r.kr
# 을 돌리면 certbot이 이 server 블록에 listen 443 ssl 과 인증서 경로를 채워 넣고
# 80은 443으로 리다이렉트하는 블록을 따로 만들어 준다.

server {
    listen 80;
    server_name handover-card.o-r.kr;

    # 앱이 25MB까지 업로드를 받는다(spring.servlet.multipart.max-file-size).
    # nginx 기본값은 1MB라 이 줄이 없으면 조금만 긴 녹음도 413으로 잘린다.
    client_max_body_size 26m;

    include /etc/nginx/snippets/handover-card-locations.conf;
}
