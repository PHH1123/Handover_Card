# EC2의 nginx 설정. /etc/nginx/conf.d/handover-card.conf 로 복사해서 쓴다.
#
# 이 파일은 HTTPS 블록이 없는 상태로 두었다. 인증서를 받기 전에는 443을 열 수 없고,
#   sudo certbot --nginx -d api.example.com
# 을 돌리면 certbot이 이 server 블록에 listen 443 ssl과 인증서 경로를 채워 넣고
# 80은 443으로 리다이렉트하는 블록을 따로 만들어 준다. 아래 proxy 설정은 그대로 443 블록에 남는다.
#
# 배포 전 api.example.com 을 실제 도메인으로 바꿀 것.

server {
    listen 80;
    server_name api.example.com;

    # 앱이 25MB까지 업로드를 받는다(spring.servlet.multipart.max-file-size).
    # nginx 기본값은 1MB라 이 줄이 없으면 조금만 긴 녹음도 413으로 잘린다.
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 이 헤더가 없으면 애플리케이션이 자기 주소를 http로 인식해 OAuth 리다이렉트 URI가
        # http://로 만들어지고 소셜 로그인이 실패한다. application-prod.yml의
        # server.forward-headers-strategy=framework 와 짝을 이룬다.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 업로드 후 전사·요약 파이프라인이 도는 동안 응답이 늦어질 수 있다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 헬스체크는 접근 로그를 남기지 않는다. 로드밸런서나 모니터링이 자주 때리면 로그만 불어난다.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
