# 가비아 클라우드 서버의 nginx 설정. /etc/nginx/conf.d/handover-card.conf 로 복사해서 쓴다.
#
# 한 도메인에서 프론트(정적 파일)와 API를 함께 서비스하는 단일 오리진 구성이다.
# 브라우저가 보기에 같은 출처라 CORS가 발생하지 않는다(그래서 CORS_ALLOWED_ORIGINS는 비워 둔다).
#
#   /            → /var/www/handover-card 의 정적 파일 (SPA)
#   /api/**      → 앱 컨테이너
#   그 외 앱 경로 → 앱 컨테이너 (아래 location 들)
#
# 이 파일은 HTTPS 블록이 없는 상태로 두었다. 인증서를 받기 전에는 443을 열 수 없고,
#   sudo certbot --nginx -d handover-card.o-r.kr
# 을 돌리면 certbot이 이 server 블록에 listen 443 ssl과 인증서 경로를 채워 넣고
# 80은 443으로 리다이렉트하는 블록을 따로 만들어 준다. 아래 설정은 그대로 443 블록에 남는다.
#
# server_name은 실제 서비스 도메인이다.

server {
    listen 80;
    server_name handover-card.o-r.kr;

    # 앱이 25MB까지 업로드를 받는다(spring.servlet.multipart.max-file-size).
    # nginx 기본값은 1MB라 이 줄이 없으면 조금만 긴 녹음도 413으로 잘린다.
    client_max_body_size 26m;

    # ---------------------------------------------------------------------
    # 프론트엔드 (SPA 빌드 산출물)
    # ---------------------------------------------------------------------
    root /var/www/handover-card;
    index index.html;

    location / {
        # SPA는 라우팅을 브라우저에서 하므로 /cards/3 같은 주소에 해당하는 파일이 서버에 없다.
        # 이 줄이 없으면 그런 주소를 직접 열거나 새로고침할 때 nginx가 404를 낸다.
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 번들 파일은 내용이 바뀌면 이름도 바뀌므로 길게 캐시해도 안전하다.
    # index.html은 위 location에서 처리되며 캐시하지 않는다 -- 캐시하면 배포해도
    # 브라우저가 옛 번들을 계속 물고 있게 된다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # 백엔드 (앱 컨테이너)
    # ---------------------------------------------------------------------
    # 프록시 설정이 여러 location에 똑같이 필요해 파일로 빼 두었다.
    # deploy/nginx/handover-card-proxy.conf 를 /etc/nginx/snippets/ 로 함께 복사할 것.
    location /api/ {
        include /etc/nginx/snippets/handover-card-proxy.conf;
    }

    # 브라우저에서 시작하는 소셜 로그인 흐름. 프론트가 아니라 서버가 처리하는 경로라
    # 정적 파일로 빠지면 로그인 버튼이 index.html을 받아 온다.
    #   /oauth2/authorization/{google|github} → 공급자로 리다이렉트
    #   /login/oauth2/code/{google|github}    → 공급자가 돌려보내는 콜백
    location /oauth2/ {
        include /etc/nginx/snippets/handover-card-proxy.conf;
    }

    location /login/oauth2/ {
        include /etc/nginx/snippets/handover-card-proxy.conf;
    }

    # API 문서.
    location /swagger-ui/ {
        include /etc/nginx/snippets/handover-card-proxy.conf;
    }

    location = /v3/api-docs {
        include /etc/nginx/snippets/handover-card-proxy.conf;
    }

    location /v3/api-docs/ {
        include /etc/nginx/snippets/handover-card-proxy.conf;
    }

    # 서버 사이드 확인용 화면(Thymeleaf). 프론트가 붙은 뒤에도 백엔드만으로 동작을
    # 확인할 수 있어 남겨 둔다. 외부에 노출하고 싶지 않으면 이 블록을 지우거나
    # allow/deny로 접근을 제한한다.
    location /web/ {
        include /etc/nginx/snippets/handover-card-proxy.conf;
    }

    # 헬스체크는 접근 로그를 남기지 않는다. 모니터링이 자주 때리면 로그만 불어난다.
    location = /actuator/health {
        include /etc/nginx/snippets/handover-card-proxy.conf;
        access_log off;
    }
}
