# 경로 분배 규칙. /etc/nginx/snippets/handover-card-locations.conf 로 복사한다.
#
#   sudo cp deploy/nginx/handover-card-locations.conf /etc/nginx/snippets/
#   sudo nginx -t && sudo systemctl reload nginx
#
# server 블록이 아니라 이 파일에 담아 두는 이유:
# certbot --nginx 는 /etc/nginx/conf.d/handover-card.conf 를 **직접 고쳐서** listen 443 ssl 과
# 인증서 경로를 써 넣는다. 그래서 저장소의 conf 파일을 그대로 덮어쓰면 그 편집분이 날아가
# HTTPS가 사라진다. 경로 규칙만 따로 두면 이 파일은 언제 덮어써도 안전하고,
# 인증서가 들어 있는 server 블록은 건드리지 않는다.
#
# 결론: **배포 후 갱신은 이 파일만 복사한다.** conf.d/handover-card.conf 는 최초 1회만 복사한다.

# ---------------------------------------------------------------------
# 프론트엔드 (SPA 빌드 산출물)
# ---------------------------------------------------------------------
root /var/www/handover-card;
index index.html;

location / {
    # SPA는 라우팅을 브라우저에서 하므로 /cards/3 같은 주소에 해당하는 파일이 서버에 없다.
    # 이 줄이 없으면 그런 주소를 직접 열거나 새로고침할 때 nginx가 404를 낸다.
    try_files $uri $uri/ /index.html;
}

# 해시가 붙은 번들 파일은 내용이 바뀌면 이름도 바뀌므로 길게 캐시해도 안전하다.
# index.html은 위 location에서 처리되며 캐시하지 않는다 -- 캐시하면 배포해도
# 브라우저가 옛 번들을 계속 물고 있게 된다.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# ---------------------------------------------------------------------
# 백엔드 (앱 컨테이너)
# ---------------------------------------------------------------------
# 프록시 설정이 여러 location에 똑같이 필요해 파일로 빼 두었다.
# deploy/nginx/handover-card-proxy.conf 를 /etc/nginx/snippets/ 로 함께 복사할 것.
location /api/ {
    include /etc/nginx/snippets/handover-card-proxy.conf;
}

# 서버가 처리하는 소셜 로그인 경로(Thymeleaf 화면용 브라우저 흐름).
# 정적 파일로 빠지면 로그인 버튼이 index.html을 받아 온다.
#   /oauth2/authorization/{google|github} → 공급자로 리다이렉트
#   /login/oauth2/code/{google|github}    → 공급자가 돌려보내는 콜백
#
# /oauth2/ 를 통째로 넘기지 않는 이유: 프론트의 콜백 경로가
# /oauth2/callback/{provider} 라서 여기서 가로채면 SPA가 아니라 백엔드가 받아 404가 난다.
# 프론트 흐름은 브라우저가 이 주소로 "돌아오는" 것이고, code를 읽어
# POST /api/auth/oauth2/{provider} 로 넘기는 일은 SPA가 한다. 그래서 정적 파일이어야 한다.
location /oauth2/authorization/ {
    include /etc/nginx/snippets/handover-card-proxy.conf;
}

location /login/oauth2/ {
    include /etc/nginx/snippets/handover-card-proxy.conf;
}

# API 문서.
location /swagger-ui/ {
    include /etc/nginx/snippets/handover-card-proxy.conf;
}

location = /v3/api-docs {
    include /etc/nginx/snippets/handover-card-proxy.conf;
}

location /v3/api-docs/ {
    include /etc/nginx/snippets/handover-card-proxy.conf;
}

# 서버 사이드 확인용 화면(Thymeleaf). 프론트가 붙은 뒤에도 백엔드만으로 동작을
# 확인할 수 있어 남겨 둔다. 외부에 노출하고 싶지 않으면 이 블록을 지우거나
# allow/deny로 접근을 제한한다.
location /web/ {
    include /etc/nginx/snippets/handover-card-proxy.conf;
}

# 헬스체크는 접근 로그를 남기지 않는다. 모니터링이 자주 때리면 로그만 불어난다.
location = /actuator/health {
    include /etc/nginx/snippets/handover-card-proxy.conf;
    access_log off;
}
